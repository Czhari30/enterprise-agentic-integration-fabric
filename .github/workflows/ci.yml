name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check enterprise_fabric tests evaluation
      - name: Test
        run: pytest -q
      - name: Evaluate governed workflows
        run: python evaluation/run.py
      - name: Compile
        run: python -m compileall -q enterprise_fabric tests evaluation

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise-agentic-integration-fabric:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
