apiVersion: v1
kind: Namespace
metadata:
  name: agentic-fabric
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-fabric
  namespace: agentic-fabric
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-fabric-config
  namespace: agentic-fabric
data:
  FABRIC_DB_PATH: /data/fabric.db
  OTEL_SERVICE_NAME: enterprise-agentic-fabric
  OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-sidecar-config
  namespace: agentic-fabric
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 127.0.0.1:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
      attributes/redact:
        actions:
          - key: gen_ai.input.messages
            action: delete
          - key: gen_ai.output.messages
            action: delete
          - key: gen_ai.tool.call.arguments
            action: delete
          - key: gen_ai.tool.call.result
            action: delete
      batch: {}
    exporters:
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-fabric
  namespace: agentic-fabric
  labels:
    app.kubernetes.io/name: enterprise-fabric
    app.kubernetes.io/part-of: governed-agent-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-fabric
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-fabric
        app.kubernetes.io/part-of: governed-agent-platform
    spec:
      serviceAccountName: enterprise-fabric
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: otel-sidecar
          image: otel/opentelemetry-collector-contrib:0.137.0
          args: ["--config=/conf/collector.yaml"]
          restartPolicy: Always
          ports:
            - name: otlp-grpc
              containerPort: 4317
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: otel-config
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: ghcr.io/czhari30/enterprise-agentic-integration-fabric:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: enterprise-fabric-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-fabric
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: otel-config
          configMap:
            name: otel-sidecar-config
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-fabric
  namespace: agentic-fabric
spec:
  selector:
    app.kubernetes.io/name: enterprise-fabric
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprise-fabric
  namespace: agentic-fabric
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-fabric
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-fabric
  namespace: agentic-fabric
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-fabric
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-fabric-default
  namespace: agentic-fabric
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-fabric
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentic-fabric
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
